<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Админ-панель — BookRate</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="container page"><div class="admin-top"><div><p class="muted">BookRate</p><h1>Админ-панель</h1></div><a href="index.html" class="btn">На сайт</a></div>
<section class="form-card admin-form"><h2>Добавить книгу</h2><form id="bookForm"><label>Название</label><input id="bookTitle" required><label>Автор</label><input id="bookAuthor" required><div class="form-grid"><div><label>Жанр</label><select id="bookCategory" required><option value="">Выберите</option><option>Фэнтези</option><option>Фантастика</option><option>Детектив</option><option>Роман</option><option>Ужасы</option><option>Нон-фикшн</option><option>Классика</option></select></div><div><label>Год</label><input id="bookYear" type="number" min="1" max="2100"></div></div><label>URL обложки</label><input id="bookImage"><label>Описание</label><textarea id="bookDescription" rows="5" required></textarea><button class="btn" style="margin-top:18px">Добавить книгу</button><p id="bookMessage" class="muted"></p></form></section>
<section><h2>Книги</h2><div class="table-wrap"><table class="table"><thead><tr><th>Книга</th><th>Автор</th><th>Рейтинг</th><th></th></tr></thead><tbody id="adminBooks"></tbody></table></div></section>
<section><h2>Модерация отзывов</h2><div class="table-wrap"><table class="table"><thead><tr><th>Книга</th><th>Оценка</th><th>Отзыв</th><th></th></tr></thead><tbody id="adminReviews"></tbody></table></div></section></main><script type="module" src="js/admin.js"></script></body></html>
